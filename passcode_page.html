<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./passcode_page.css">
</head>
<body>
    <div class="text">
        <h1>Enter Your PIN</h1>
        <p>Use the keypad to enter your four-digit demo PIN. keep your PIN private.</p>
    </div>
    <div>
        <div class="display_box">
            <p>FOUR-DIGIT PIN</p>
             <input type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1">
            <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 2">
            <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 3">
            <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 4">
            <ul></ul>
        </div>
        <div class="buttons">
            <div class="btn_rows">
                <button>1</button>
                <button>2</button>
                <button>3</button>
            </div>
            <div class="btn_rows">
                <button>4</button>
                <button>5</button>
                <button>6</button>
            </div>
            <div class="btn_rows">
                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div class="btn_rows">
                <button>clear</button>
                <button>0</button>
                <button>delte</button>
            </div>
        </div>
    </div>
    
</body>
</html>
