<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>passcode page</title>
    <link rel="stylesheet" href="./passcode_page.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="top-navbar">
        <div class="logo-area">
                <p>DIGITAL ATM</p>
            </div>
        </div>
        <div class="terminal-info">
            <p class="date-time">09 Oct 2026 • 14:30</p>
            <p class="terminal-name">Dataslid DEMO TERMINAL</p>
        </div>
    </header>
    
    <div class="text">
        <h1>Enter Your PIN</h1>
        <p>Use the keypad to enter your four-digit demo PIN. keep your PIN private.</p>
    </div>
    <main class="pin-layout">
        <section class="display_box">
            <div class="account-summary">
                <h2>Alex Johnson</h2>
                <p>Savings Account · **** **** 4821</p>
            </div>
            <p class="pin-label">FOUR-DIGIT PIN</p>
            <div class="pin-inputs">
                <input type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1">
                <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 2">
                <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 3">
                <input type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 4">
            </div>
        </section>
        <section class="keypad-section">
            <p class="keypad-label">Touch keypad</p>
            <div class="buttons">
            <div class="btn_rows">
                <button>1</button>
                <button>2</button>
                <button>3</button>
            </div>
            <div class="btn_rows">
                <button>4</button>
                <button>5</button>
                <button>6</button>
            </div>
            <div class="btn_rows">
                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div class="btn_rows">
                <button>clear</button>
                <button>0</button>
                <button>delte</button>
            </div>
            </div>
            <div class="keypad-actions">
                <a class="cancel-button" href="./welcome_page.html">Cancel</a>
                <form action="./dashboard.html" method="get">
                    <button type="submit" class="enter-button">Enter</button>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
