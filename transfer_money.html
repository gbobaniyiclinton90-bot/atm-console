<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Funds | Apex Digital Bank</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./withdraw_cash.css">
    <link rel="stylesheet" href="./transfer_money.css">
</head>
<body class="transfer-page">
    <header class="top-navbar">
        <div class="logo-area">
            <p>DIGITAL ATM</p>
        </div>
        <div class="terminal-info">
            <p class="date-time">09 Oct 2026 • 14:30</p>
            <p class="terminal-name">Dataslid DEMO TERMINAL</p>
        </div>
    </header>

    <main class="withdraw-main">
        <div class="page-heading">
            <h1>Transfer Funds.</h1>
            <p>Send simulated funds to a fictional recipient. No real account lookup occurs.</p>
        </div>

        <div class="withdraw-layout">
            <section class="withdraw-details" aria-label="Transfer details">
                <div class="amount-card transfer-card">
                    <label class="transfer-field-label" for="destination-account">Destination account · 10 digits</label>
                    <input class="transfer-field"  id="destination-account" type="text" inputmode="numeric"  maxlength="10" autocomplete="off" placeholder="Enter 10-digit account number" readonly>

                    <label class="visually-hidden" for="destination-bank">Fictional destination bank</label>
                   <select class="transfer-field transfer-bank" id="destination-bank">
                        <option value="" selected disabled>Select destination bank</option>
                        <option value="apex-demo">Fictional bank: Apex Demo Bank</option>
                        <option value="unity-demo">Fictional bank: Unity Demo Bank</option>
                        <option value="sample-trust">Fictional bank: Sample Trust Bank</option>
                    </select>

                    <label class="transfer-field-label" for="custom-amount">Transfer amount (NGN)</label>
                    <input class="transfer-field transfer-amount" id="custom-amount"   type="text" inputmode="numeric" value="₦15,000" readonly>

                    <div class="transfer-balance">
                        <span>Available balance</span>
                        <strong id="balance"></strong>
                    </div>
                   <aside class="">
                      <p id="transfer-message" role="status" aria-live="polite"></p>
                   </aside>                    
                </div>

                <div class="withdraw-actions">
                    <a class="cancel-main" href="./dashboard.html">Cancel</a>
                    <button class="confirm-withdrawal" id="confirm-transfer" type="button" hidden>Transfer</button>
                </div>
            </section>

            <section class="keypad-panel" aria-label="Numeric keypad">
                <h2>Numeric entry</h2>
                <div class="amount-keypad">
                    <button class="withdraw-button" type="button">1</button>
                    <button class="withdraw-button" type="button">2</button>
                    <button class="withdraw-button" type="button">3</button>
                    <button class="withdraw-button" type="button">4</button>
                    <button class="withdraw-button" type="button">5</button>
                    <button class="withdraw-button" type="button">6</button>
                    <button class="withdraw-button" type="button">7</button>
                    <button class="withdraw-button" type="button">8</button>
                    <button class="withdraw-button" type="button">9</button>
                    <button class="withdraw-button" class="keypad-utility" type="button">Clear</button>
                    <button class="withdraw-button" type="button">0</button>
                    <button class="withdraw-button" class="keypad-utility" type="button">Delete</button>
                </div>
                <div class="keypad-actions">
                    <a href="./dashboard.html">Cancel</a>
                </div>
            </section>
        </div>
    </main>

    <footer class="withdraw-footer">
        <span>Educational simulator — no real transactions.</span>
        <span class="session-status"><i aria-hidden="true"></i> Demo session · Connected</span>
    </footer>
</body>
<script src="./atm-users.js"></script>
<script src="./atm.js"></script>
</html>
