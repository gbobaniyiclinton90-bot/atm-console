<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM CONSOLE</title>
    <link rel="stylesheet" href="./style.css">   
</head>
<body>
    <header class="top-navbar">
        <div class="logo-area">
                <p>DIGITAL ATM</p>
            </div>
        </div>
        <div class="terminal-info">
            <p class="date-time">09 Oct 2026 • 14:30</p>
            <p class="terminal-name">Dataslid DEMO TERMINAL</p>
        </div>
    </header>

    <div class="texts">
        <h1>WELCOME TO DATASLIDE ATM</h1>
        <h1>Let's get you started</h1>
    </div>
    <main class="parent">
         <aside class="atm-illustration" aria-label="Illustration of a demo bank card ready for insertion">
            <div class="demo-card">
                <div class="demo-card__stripe"></div>
                <div class="demo-card__content">
                    <div class="demo-card__brand">
                        <span class="demo-card__logo" aria-hidden="true">D</span>
                        <span>
                            <strong>DATASLIDE</strong>
                            <small>DIGITAL ATM</small>
                        </span>
                    </div>
                    <div class="demo-card__chip" aria-hidden="true"><span></span></div>
                    <p class="demo-card__number"></p>
                    <div class="demo-card__footer">
                        <span></span>
                        <strong>DEMO</strong>
                    </div>
                </div>
            </div>
            <div class="card-slot">
                <p><span class="card-slot__icon" aria-hidden="true"></span> DEMO CARD SLOT</p>
                <div class="card-slot__opening" aria-hidden="true"></div>
                <div class="card-slot__underline" aria-hidden="true"></div>
            </div>
            <p class="atm-illustration__caption">Card shown ready for insertion. Static educational illustration.</p>
        </aside>
        <section class="account">
            <p>Insert your card to get started</p>
        
            <div id="atmUsersContainer">

            </div>
            
        </section>

    </main>


    <script src="./atm-users.js"></script>
    <script src="./atm.js"></script>
   
</body>
</html>
